services:
  - type: web
    name: nova-world-live
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nova-world-db
          property: connectionString
      - key: TOKEN_SECRET
        generateValue: true
      - key: DB_SSL
        value: "true"
databases:
  - name: nova-world-db
    databaseName: nova_world
    user: nova_world
